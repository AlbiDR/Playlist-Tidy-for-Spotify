<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Playlist Tidy mark</title>
  <desc id="description">A glowing green playlist row with an up arrow, above two older rows, tilted upward: newest first.</desc>
  <defs>
    <radialGradient id="bg" cx="42%" cy="18%" r="95%">
      <stop offset="0" stop-color="#1F4B31"/>
      <stop offset="0.5" stop-color="#121815"/>
      <stop offset="1" stop-color="#090909"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CF793"/>
      <stop offset="1" stop-color="#17C257"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-90%" width="160%" height="280%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g transform="translate(14 10) rotate(-8 256 256)">
    <!-- glow behind the newest row -->
    <rect x="72" y="112" width="368" height="86" rx="43" fill="#22D65F" opacity="0.75" filter="url(#glow)"/>
    <!-- newest row: big green pill with an arrow badge -->
    <rect x="72" y="108" width="368" height="86" rx="43" fill="url(#g)"/>
    <rect x="84" y="114" width="344" height="30" rx="15" fill="url(#gloss)" opacity="0.5"/>
    <circle cx="127" cy="151" r="36" fill="#0A0A0A"/>
    <path d="M127 169 V133 M109 150 L127 132 L145 150" fill="none" stroke="#5CF793" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- older rows -->
    <rect x="72" y="226" width="300" height="68" rx="34" fill="#E4E4E4" opacity="0.9"/>
    <rect x="72" y="326" width="220" height="68" rx="34" fill="#E4E4E4" opacity="0.5"/>
    <!-- track metadata: title and artist lines -->
    <rect x="176" y="132" width="156" height="19" rx="9.5" fill="#0A0A0A" opacity="0.82"/>
    <rect x="176" y="160" width="98" height="14" rx="7" fill="#0A0A0A" opacity="0.4"/>
    <!-- older tracks: cover thumbnail, title, artist -->
    <rect x="84" y="236" width="48" height="48" rx="14" fill="#0A0A0A" opacity="0.42"/>
    <rect x="148" y="243" width="150" height="15" rx="7.5" fill="#0A0A0A" opacity="0.5"/>
    <rect x="148" y="267" width="92" height="12" rx="6" fill="#0A0A0A" opacity="0.26"/>
    <rect x="84" y="336" width="48" height="48" rx="14" fill="#0A0A0A" opacity="0.4"/>
    <rect x="148" y="343" width="92" height="15" rx="7.5" fill="#0A0A0A" opacity="0.45"/>
    <rect x="148" y="367" width="58" height="12" rx="6" fill="#0A0A0A" opacity="0.24"/>
    <!-- equalizer bars: now playing, newest first -->
    <rect x="368" y="141.0" width="9" height="20" rx="4.5" fill="#0A0A0A" opacity="0.85"/>
    <rect x="383" y="132.0" width="9" height="38" rx="4.5" fill="#0A0A0A" opacity="0.85"/>
    <rect x="398" y="137.0" width="9" height="28" rx="4.5" fill="#0A0A0A" opacity="0.85"/>
    <rect x="413" y="129.0" width="9" height="44" rx="4.5" fill="#0A0A0A" opacity="0.85"/>
  </g>
</svg>
