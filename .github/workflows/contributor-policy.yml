name: Contributor Attribution Policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contributor-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject unapproved or automated attribution
        run: node scripts/verify-contributors.mjs
