name: Verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify project
        run: npm run verify

      - name: Restore Playwright browser runtimes
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser audit runtimes
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            echo "Playwright browser installation attempt $attempt of 3"
            if timeout --signal=TERM --kill-after=15s 180s npx playwright install --with-deps chromium firefox webkit; then
              exit 0
            fi
          done
          exit 1

      - name: Audit built website
        run: npm run audit:web

      - name: Audit dependencies
        run: npm run audit:dependencies
