name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify manually dispatched project
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify
        env:
          PLAYLIST_TIDY_RELEASE_SHA: ${{ github.sha }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_WEB_CLIENT_ID }}

      - name: Build verified deployment artifact
        if: github.event_name == 'workflow_run'
        run: npm run build
        env:
          PLAYLIST_TIDY_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_WEB_CLIENT_ID }}

      - name: Restore Playwright browser runtimes
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium system dependencies
        if: github.event_name == 'workflow_run'
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      - name: Install Chromium capture runtime
        if: github.event_name == 'workflow_run'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            echo "Playwright Chromium installation attempt $attempt of 3"
            if timeout --signal=TERM --kill-after=15s 180s npx playwright install chromium; then
              exit 0
            fi
          done
          exit 1

      - name: Install manual browser system dependencies
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: npx playwright install-deps chromium firefox webkit

      - name: Install manual browser audit runtimes
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            echo "Playwright browser installation attempt $attempt of 3"
            if timeout --signal=TERM --kill-after=15s 180s npx playwright install chromium firefox webkit; then
              exit 0
            fi
          done
          exit 1

      - name: Audit manually dispatched website
        if: github.event_name == 'workflow_dispatch'
        run: npm run audit:web

      - name: Capture current README views
        run: npm run capture:readme

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
